name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    # pywin32 is a hard dependency and only installs on Windows,
    # which is also the only platform the server actually targets.
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package (validates build backend)
        run: pip install -e .

      - name: Run offline test suite
        run: python test_server.py
