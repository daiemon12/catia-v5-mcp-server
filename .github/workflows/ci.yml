name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    # Windows is the only platform the server drives CATIA on (pywin32 is
    # a Windows-only dependency); the offline suite itself is portable.
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package (validates build backend)
        run: pip install -e ".[dev]"

      - name: Run offline test suite
        run: python -m pytest tests test_server.py -q
